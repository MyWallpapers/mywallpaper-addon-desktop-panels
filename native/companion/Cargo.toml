[package]
name = "desktop-panels"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "desktop-panels"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
serde_json = "1.0.145"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
debug = 0
